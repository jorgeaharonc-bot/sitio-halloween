<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="title desc">
  <title id="title">Calaverita de Día de Muertos</title>
  <desc id="desc">Una calavera sonriente rodeada de flores de cempasúchil, velas y papel picado.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#39224d"/><stop offset="1" stop-color="#1d122b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffbd58" stop-opacity=".34"/><stop offset="1" stop-color="#ffbd58" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="420" height="500" rx="26" fill="url(#bg)"/>
  <circle cx="210" cy="240" r="190" fill="url(#glow)"/>
  <!-- papel picado -->
