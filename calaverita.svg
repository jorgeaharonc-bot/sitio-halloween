  <g fill="#ff70a6"><circle cx="158" cy="205" r="10"/><circle cx="158" cy="293" r="10"/><circle cx="114" cy="249" r="10"/><circle cx="202" cy="249" r="10"/><circle cx="262" cy="205" r="10"/><circle cx="262" cy="293" r="10"/><circle cx="218" cy="249" r="10"/><circle cx="306" cy="249" r="10"/></g>
